  <style>
    .coming-soon-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 4rem 2rem;
      text-align: center;
    }

    .coming-soon-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: rocketFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(211, 166, 37, 0.4));
    }

    @keyframes rocketFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      25% { transform: translateY(-20px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
      75% { transform: translateY(-25px) rotate(0deg); }
    }

    .coming-soon-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--gold);
      text-shadow: 0 0 30px var(--gold-glow);
      letter-spacing: 4px;
      margin-bottom: 1rem;
      animation: titlePulse 4s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 0 0 20px var(--gold-glow); }
      50% { text-shadow: 0 0 50px var(--gold-glow), 0 0 80px rgba(211,166,37,0.15); }
    }

    .coming-soon-text {
      font-size: 1.2rem;
      color: var(--parchment-dark);
      opacity: 0.8;
      font-style: italic;
      margin-bottom: 2.5rem;
      max-width: 500px;
    }

    /* Animated dots */
    .dots-container {
      display: flex;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold);
      animation: dotBounce 1.5s ease-in-out infinite;
      box-shadow: 0 0 10px var(--gold-glow);
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* Decorative orbiting ring */
    .orbit-ring {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 2rem;
    }

    .orbit-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid rgba(211, 166, 37, 0.15);
      border-radius: 50%;
      animation: ringRotate 8s linear infinite;
    }

    .orbit-ring::after {
      content: '⚡';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.2rem;
      animation: ringRotate 8s linear infinite;
      transform-origin: 0 108px;
    }

    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orbit-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.5rem;
      animation: rocketFloat 3s ease-in-out infinite;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.7rem 2rem;
      background: linear-gradient(135deg, rgba(211, 166, 37, 0.15), rgba(116, 0, 1, 0.2));
      border: 1px solid var(--gold);
      border-radius: 30px;
      color: var(--gold);
      font-family: var(--font-subheading);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      background: var(--gold);
      color: var(--navy-dark);
      box-shadow: var(--shadow-gold);
      transform: translateY(-2px);
    }
  </style>
</head>
